name: Custom Docker Image

on:
  push:
    branches:
      - custom/main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label, for example 0.1.131'
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: custom-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set metadata
        id: meta
        shell: bash
        run: |
          version="${{ github.event.inputs.version }}"
          if [ -z "$version" ] && [ -f backend/cmd/server/VERSION ]; then
            version="$(tr -d '\r\n' < backend/cmd/server/VERSION)"
          fi
          if [ -z "$version" ]; then
            version="custom"
          fi
          commit="$(git rev-parse --short=12 HEAD)"
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          repo="$(basename '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/${repo}-custom"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            DATE=${{ steps.meta.outputs.date }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}-codecc-${{ steps.meta.outputs.commit }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
